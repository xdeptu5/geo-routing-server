# Раздача корневых симлинков без токена (/HAPP/, /INCY/, /<ПРЕСЕТ>/HAPP/...).
# Подключается внутри location во внутреннем сервере (порт 81) и — только в
# переходном режиме INTERNAL_ACCESS_ON_PORT_80=true — на публичном порту 80.
#
# Доступ — только с частных адресов и только напрямую: запрос с заголовками
# прокси отклоняется по самому факту их наличия (значение не читается, так
# что подставить себе доверенный адрес нельзя).
access_log off;
allow 127.0.0.1;
allow ::1;
allow 10.0.0.0/8;
allow 172.16.0.0/12;
allow 192.168.0.0/16;
deny all;

if ($http_x_forwarded_for != "") { return 403; }
if ($http_x_real_ip != "") { return 403; }
if ($http_x_forwarded_proto != "") { return 403; }

autoindex off;
add_header Access-Control-Allow-Origin * always;
add_header Cache-Control "no-store, no-cache, must-revalidate" always;
add_header Pragma "no-cache" always;
add_header Expires 0 always;
add_header X-Content-Type-Options nosniff always;
try_files $uri =404;
