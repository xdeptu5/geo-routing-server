server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    root /app/www;

    etag on;

    # Healthcheck endpoint для Docker
    location = /health {
        access_log off;
        return 200 "healthy\n";
    }

    # Запрет отдачи скрытых и системных файлов (.git, .cache и т.д.)
    location ~ /\. {
        deny all;
        return 404;
    }

    # 1. Запрещаем прямой доступ к JSON и DEEPLINK для клиента HAPP (только geo-базы)
    location ~* ^/[^/]+/HAPP/.*\.(?:json|deeplink)$ {
        return 404;
    }

    # 2. Раздача .dat баз с поддержкой conditional requests (304 Not Modified)
    location ~* \.dat$ {
        autoindex off;
        add_header Cache-Control "public, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # 3. Раздача JSON, DEEPLINK и sha256
    location / {
        autoindex off;
        default_type text/plain;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ =404;
    }
}
