# ==============================================================================
# Внутренний nginx контейнера — раздача приватных geo/routing-правил.
# Копируется в /etc/nginx/http.d/default.conf (см. Dockerfile).
#
# МОДЕЛЬ ДОВЕРИЯ (существенно, не убирать без пересмотра):
#   * Авторизация опирается ТОЛЬКО на адрес TCP-соединения ($remote_addr).
#     Директив real_ip здесь намеренно НЕТ: заголовки X-Forwarded-For,
#     X-Real-IP и X-Forwarded-Proto, присланные клиентом, никогда не подменяют
#     $remote_addr и не участвуют в проверке allow/deny — иначе любой, кто
#     умеет достучаться до этого nginx, подставит себе доверенный IP.
#   * Наружу запросы идут только через внешний reverse-proxy пользователя
#     (compose публикует порт на 127.0.0.1), поэтому наличие заголовков
#     прокси используется исключительно как признак «запрос прошёл через
#     HTTP-прокси»: значение не интерпретируется, важен только факт наличия.
#     К токен-независимым путям /HAPP/ и /INCY/ такие запросы отклоняются —
#     внешним клиентам доступен только путь с токеном /<ROUTING_TOKEN>/...
#   * Исходные значения заголовков пишутся в access-лог отдельными полями
#     (xff=/xri=/xfp=) только для диагностики, не для контроля доступа.
# ==============================================================================

# Маскирование токена в логах для предотвращения утечки секрета в docker logs.
# Токен-независимые пути (/health, /HAPP, /INCY) и корень не маскируются.
map $request $clean_request {
    "~*^(\S+)\s+/(?!health(?:/|\s|$)|HAPP(?:/|\s|$)|INCY(?:/|\s|$))[A-Za-z0-9_-]{4,}(/.*)?\s+(\S+)$" "$1 /***REDACTED_TOKEN***$2 $3";
    default $request;
}

map $http_referer $clean_referer {
    "~*^(https?://[^/]+)/[A-Za-z0-9_-]{4,}(/.*)?$" "$1/***REDACTED_TOKEN***$2";
    default $http_referer;
}

# Формат логов: обычная combined-строка с замаскированным токеном + исходные
# значения заголовков прокси. escape=json не даёт клиенту подделать разбор логов.
log_format grs escape=json
    '$remote_addr - $remote_user [$time_local] "$clean_request" '
    '$status $body_bytes_sent "$clean_referer" "$http_user_agent" '
    'xff="$http_x_forwarded_for" xri="$http_x_real_ip" xfp="$http_x_forwarded_proto"';

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    root /app/www;
    server_tokens off;

    etag on;

    # Свой access_log на уровне server заменяет наследуемый лог верхнего
    # уровня (двойной записи в один файл не будет).
    access_log /var/log/nginx/access.log grs;

    # Заголовки для всех ответов, чей location НЕ задаёт собственных add_header
    # (/health, /, скрытые файлы, 404 из token-access.conf, 405/204/400).
    # Ловушка nginx: location со своими add_header серверные НЕ наследует,
    # поэтому каждый такой location перечисляет полный набор самостоятельно.
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires 0 always;
    add_header X-Content-Type-Options nosniff always;

    # Запрет небезопасных HTTP методов. Срабатывает в фазе rewrite — тело
    # запроса не читается, отдельный client_max_body_size не требуется.
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }

    # Preflight OPTIONS запросы
    if ($request_method = OPTIONS) {
        return 204;
    }

    # Healthcheck endpoint для Docker: отдаёт только статическую строку,
    # файлы и параметры не читает, обойти авторизацию им нельзя.
    # Остальные методы отсекаются общим правилом 405 выше.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Запрет отдачи скрытых и системных файлов (.git, .cache, .tmp и т.д.)
    # return выполняется в фазе rewrite раньше allow/deny — отдача закрыта.
    location ~ /\. {
        deny all;
        return 404;
    }

    # Entry point generates this allowlist from the current ROUTING_TOKEN.
    # It rejects stale token directories without deleting their data.
    include /etc/nginx/token-access.conf;

    # Корневые симлинки без токена (/HAPP/, /INCY/, /<ПРЕСЕТ>/HAPP/ ...) для
    # потребителей из Docker-сети. На ЭТОМ, публикуемом наружу порту они
    # закрыты: при пробросе порта Docker соединение приходит с адреса шлюза
    # из 172.16.0.0/12, и если внешний прокси не ставит X-Forwarded-For,
    # файлы отдавались бы без токена. Раздаются на внутреннем порту 81 (ниже).
    # Файл генерирует docker-entrypoint.sh: `return 404;` или — при
    # INTERNAL_ACCESS_ON_PORT_80=true — прежнее поведение (переходный режим).
    location ~ ^/(HAPP|INCY|GEOGAGA|VAHELLAME|HYDRAPONIQUE)/ {
        include /etc/nginx/grs-public-internal-paths.conf;
    }

    # 1. Раздача .dat баз: выключен gzip (предотвращает 100% CPU load), включен sendfile.
    # Единственный кэшируемый блок — поэтому Pragma/Expires здесь не ставим.
    # access_log off исключает утечку токенов в docker logs и снижает дисковую нагрузку.
    location ~* \.dat$ {
        access_log off;
        autoindex off;
        gzip off;
        sendfile on;
        tcp_nopush on;
        sendfile_max_chunk 1m;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # 2. Раздача JSON конфигураций с правильным MIME-типом
    location ~* \.json$ {
        access_log off;
        autoindex off;
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires 0 always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # 3. Проверка доступности корня веб-сервера
    location = / {
        default_type text/plain;
        return 200 "geo-routing-server is running\n";
    }

    # 4. Раздача DEEPLINK и текстовых файлов (приватные правила — не кэшировать)
    location / {
        access_log off;
        autoindex off;
        default_type text/plain;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires 0 always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
}

# ==============================================================================
# Внутренний порт 81: только пути без токена, для контейнеров из той же
# Docker-сети (http://geo-routing-server:81/HAPP/geoip.dat). compose.yaml
# этот порт не публикует, поэтому снаружи он недоступен в принципе.
# ==============================================================================
server {
    listen 81;
    listen [::]:81;

    server_name _;
    root /app/www;
    server_tokens off;
    access_log off;

    add_header X-Content-Type-Options nosniff always;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location = /health {
        default_type text/plain;
        return 200 "healthy\n";
    }

    location ~ /\. {
        return 404;
    }

    location ~ ^/(HAPP|INCY|GEOGAGA|VAHELLAME|HYDRAPONIQUE)/ {
        include /etc/nginx/snippets/grs-internal-paths.conf;
    }

    location / {
        return 404;
    }
}
