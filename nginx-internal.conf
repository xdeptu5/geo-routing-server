server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    root /app/www;
    server_tokens off;

    etag on;

    # Определение реального IP-адреса клиента за реверс-прокси (Caddy / Nginx / NPM)
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Запрет небезопасных HTTP методов
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }

    # Preflight OPTIONS запросы
    if ($request_method = OPTIONS) {
        return 204;
    }

    # Healthcheck endpoint для Docker
    location = /health {
        access_log off;
        return 200 "healthy\n";
    }

    # Запрет отдачи скрытых и системных файлов (.git, .cache, .tmp и т.д.)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Защита токена: прямой доступ к корневым симлинкам разрешен ТОЛЬКО из внутренней Docker-сети
    location ~ ^/(HAPP|INCY)/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        autoindex off;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # 1. Раздача .dat баз: выключен gzip (предотвращает 100% CPU load), включен sendfile
    location ~* \.dat$ {
        autoindex off;
        gzip off;
        sendfile on;
        tcp_nopush on;
        sendfile_max_chunk 1m;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # 2. Раздача JSON конфигураций с правильным MIME-типом
    location ~* \.json$ {
        autoindex off;
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # 3. Раздача DEEPLINK и sha256
    location / {
        autoindex off;
        default_type text/plain;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ =404;
    }
}
