name: CI and Docker Image

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
    paths-ignore:
      - '**.md'
      - '.github/FUNDING.yml'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - '.github/FUNDING.yml'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Версии инструментов зафиксированы: те же версии используются локально
  # (см. ruff.toml и раздел «Разработка и проверки» в README.md).
  PYTHON_VERSION: '3.12'      # Dockerfile: alpine:3.21 -> python3 = 3.12.x
  RUFF_VERSION: '0.16.9'
  PYTEST_VERSION: '9.1.1'
  PYYAML_VERSION: '6.0.3'   # только для тестов (проверка генерации compose.yaml)

jobs:
  python-lint-and-tests:
    name: "Python: ruff lint + pytest"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned lint/test tools
        run: python -m pip install --disable-pip-version-check "ruff==${{ env.RUFF_VERSION }}" "pytest==${{ env.PYTEST_VERSION }}" "PyYAML==${{ env.PYYAML_VERSION }}"

      - name: Ruff lint (app/, tests/)
        run: ruff check app tests

      - name: Compile check (app/)
        run: python -m compileall -q app

      - name: Unit tests (tests/, no network / no Docker)
        run: python -m pytest -q

  shellcheck:
    name: Shellcheck (install.sh, docker-entrypoint.sh)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck (severity >= warning)
        run: shellcheck -S warning install.sh docker-entrypoint.sh tests/shell/run.sh tests/shell/docker tests/shell/curl

  installer-tests:
    name: "install.sh: integration tests (stub docker, real CLI)"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Тесты пишут в /etc и /usr/local/bin, поэтому идут в одноразовом контейнере
      - name: Run tests/shell/run.sh in a clean container
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo python:${{ env.PYTHON_VERSION }}-slim bash tests/shell/run.sh

  build:
    name: Build and publish Docker image
    # Сборка и публикация образа — только для push/dispatch, не для pull request.
    if: github.event_name != 'pull_request'
    needs: [ python-lint-and-tests, shellcheck, installer-tests ]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # git-тег vX.Y.Z для нового релиза
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a version bump for installer changes
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          if git diff --quiet "$PREVIOUS_SHA" "$GITHUB_SHA" -- install.sh; then
            exit 0
          fi

          if git log -1 --pretty=%B | grep -qiE '\[skip-version-check\]|\[no-bump\]'; then
            echo "Skipping version bump requirement based on commit flag"
            exit 0
          fi

          previous_version=$(git show "$PREVIOUS_SHA:install.sh" | sed -n 's/^SCRIPT_VERSION="\([0-9][0-9.]*\)"/\1/p' | head -n 1)
          current_version=$(sed -n 's/^SCRIPT_VERSION="\([0-9][0-9.]*\)"/\1/p' install.sh | head -n 1)
          if [ -z "$previous_version" ] || [ -z "$current_version" ] || [ "$previous_version" = "$current_version" ]; then
            echo "install.sh changed without a new SCRIPT_VERSION"
            exit 1
          fi

          if [ "$(printf '%s\n%s\n' "$previous_version" "$current_version" | sort -V | tail -n 1)" != "$current_version" ]; then
            echo "SCRIPT_VERSION must increase: $previous_version -> $current_version"
            exit 1
          fi

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Тег версии образа неизменяем: публикуется только первым коммитом в main
      # с новой версией из app/__init__.py. Последующие правки той же версии
      # обновляют лишь :latest и :sha-<коммит>, а :X.Y.Z остаётся тем, что
      # было выпущено, — на него можно закрепиться или откатиться.
      - name: Resolve release version
        id: version
        run: |
          version=$(sed -n 's/^__version__ = "\([0-9][0-9.]*\)"/\1/p' app/__init__.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = "refs/heads/main" ] && ! docker manifest inspect "$REGISTRY/$IMAGE_NAME:$version" >/dev/null 2>&1; then
            echo "new_release=true" >> "$GITHUB_OUTPUT"
            echo "New release: $version"
          else
            echo "new_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.new_release == 'true' }}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GITHUB_TOKEN не запускает workflow заново, поэтому тег не вызывает повторную сборку
      - name: Tag the release in git
        if: steps.version.outputs.new_release == 'true'
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists"
            exit 0
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
