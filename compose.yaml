services:
  geo-routing-server:
    # Готовый официальный образ из GitHub Registry:
    image: ghcr.io/xdeptu5/geo-routing-server:latest
    # (Если вы хотите собрать образ локально из исходников — раскомментируйте строчку ниже):
    # build: .

    container_name: geo-routing-server
    restart: unless-stopped
    env_file:
      - .env

    # Для прямого доступа к Remnawave API подключите существующую сеть панели:
    # networks:
    #   - remnawave

    # Локальный порт для подключения вашего реверс-прокси (Caddy или Nginx):
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"

    # Хранилище сгенерированных баз и локальный кэш:
    volumes:
      - routing_data:/app/www
      - ./.cache:/app/.cache
      - ./custom_geo:/app/custom_geo:ro

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  routing_data:

# Раскомментируйте вместе с networks в сервисе. Укажите имя существующей сети
# в DOCKER_NETWORK (например, remnawave-network).
# networks:
#   remnawave:
#     external: true
#     name: "${DOCKER_NETWORK:-remnawave-network}"
