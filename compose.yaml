name: geo-routing-server

services:
  geo-routing-server:
    # Готовый официальный образ из GitHub Registry:
    image: ghcr.io/xdeptu5/geo-routing-server:latest
    # (Если вы хотите собрать образ локально из исходников — раскомментируйте строчку ниже):
    # build: .

    container_name: geo-routing-server
    restart: unless-stopped
    env_file:
      - .env

    # Для прямого доступа к Remnawave API подключите существующую сеть панели:
    # networks:
    #   - remnawave

    # Локальный порт для подключения вашего реверс-прокси (Caddy или Nginx):
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"

    # Ограничения контейнера (проверены запуском собранного образа):
    #  - no-new-privileges: процессы не могут повысить привилегии;
    #  - cap_drop ALL + точечный cap_add: из стандартного набора Docker
    #    оставлено только реально нужное контейнеру:
    #      NET_BIND_SERVICE — nginx слушает 80/tcp (на ядрах с
    #        net.ipv4.ip_unprivileged_port_start=1024 без этого bind падает);
    #      SETUID/SETGID/CHOWN — мастер nginx создаёт воркеров под
    #        пользователем nginx и chown-ит свои временные каталоги;
    #      DAC_OVERRIDE — запись в /var/lib/nginx (принадлежит nginx);
    #      KILL — мастер останавливает воркеры при graceful shutdown.
    #    Отброшенные NET_RAW, NET_ADMIN, MKNOD, SETFCAP, SETPCAP, FOWNER,
    #    FSETID, SYS_CHROOT, AUDIT_WRITE контейнеру не требуются.
    #  read_only не применяется: docker-entrypoint.sh пишет
    #  /etc/nginx/token-access.conf, /etc/environment.sh, /etc/crontabs/root.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - KILL

    # Хранилище сгенерированных баз и локальный кэш:
    volumes:
      - routing_data:/app/www
      - ./.cache:/app/.cache
      - ./custom_geo:/app/custom_geo:ro

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  routing_data:

# Раскомментируйте вместе с networks в сервисе. Укажите имя существующей сети
# в DOCKER_NETWORK (например, remnawave-network).
# networks:
#   remnawave:
#     external: true
#     name: "${DOCKER_NETWORK:-remnawave-network}"
