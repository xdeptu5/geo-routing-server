services:
  geo-routing-server:
    # Готовый официальный образ из GitHub Registry:
    image: ghcr.io/xdeptu5/geo-routing-server:latest
    # (Если вы хотите собрать образ локально из исходников — раскомментируйте строчку ниже):
    # build: .

    container_name: geo-routing-server
    restart: unless-stopped

    # Настройки сервиса (значения берутся из файла .env или можно вписать прямо сюда):
    environment:
      DOMAIN: "${DOMAIN:-geo.example.com}"
      ROUTING_TOKEN: "${ROUTING_TOKEN:-}"
      ENABLED_CLIENTS: "${ENABLED_CLIENTS:-HAPP,INCY}"
      PUBLIC_GEO_BASE_URL: "${PUBLIC_GEO_BASE_URL:-}"
      SCHEDULE: "${SCHEDULE:-40 8 * * *}"
      SYNC_ON_START: "${SYNC_ON_START:-true}"
      GEOIP_SOURCE_URL: "${GEOIP_SOURCE_URL:-}"
      GEOSITE_SOURCE_URL: "${GEOSITE_SOURCE_URL:-}"
      ROUTING_SOURCE_REPO: "${ROUTING_SOURCE_REPO:-https://raw.githubusercontent.com/hydraponique/roscomvpn-routing/main}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      TELEGRAM_THREAD_ID: "${TELEGRAM_THREAD_ID:-}"
      TELEGRAM_NOTIFY_SUCCESS: "${TELEGRAM_NOTIFY_SUCCESS:-false}"
      # Прямая интеграция с Remnawave API (до 3 сквадов; для 4+ добавьте REMNAWAVE_SQUAD_4_UUID и т.д.):
      REMNAWAVE_BASE_URL: "${REMNAWAVE_BASE_URL:-}"
      REMNAWAVE_TOKEN: "${REMNAWAVE_TOKEN:-}"
      REMNAWAVE_GLOBAL_RULE: "${REMNAWAVE_GLOBAL_RULE:-}"
      REMNAWAVE_SQUAD_1_UUID: "${REMNAWAVE_SQUAD_1_UUID:-}"
      REMNAWAVE_SQUAD_1_RULE: "${REMNAWAVE_SQUAD_1_RULE:-}"
      REMNAWAVE_SQUAD_2_UUID: "${REMNAWAVE_SQUAD_2_UUID:-}"
      REMNAWAVE_SQUAD_2_RULE: "${REMNAWAVE_SQUAD_2_RULE:-}"
      REMNAWAVE_SQUAD_3_UUID: "${REMNAWAVE_SQUAD_3_UUID:-}"
      REMNAWAVE_SQUAD_3_RULE: "${REMNAWAVE_SQUAD_3_RULE:-}"
      # Если Remnawave защищена Cloudflare Zero Trust (Service Token):
      CLOUDFLARE_ZERO_TRUST_CLIENT_ID: "${CLOUDFLARE_ZERO_TRUST_CLIENT_ID:-}"
      CLOUDFLARE_ZERO_TRUST_CLIENT_SECRET: "${CLOUDFLARE_ZERO_TRUST_CLIENT_SECRET:-}"

    # Локальный порт для подключения вашего реверс-прокси (Caddy или Nginx):
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"

    # Хранилище сгенерированных баз и локальный кэш:
    volumes:
      - routing_data:/app/www
      - ./.cache:/app/.cache
      - ./custom_geo:/app/custom_geo:ro

    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  routing_data:
